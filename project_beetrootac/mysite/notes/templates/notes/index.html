<!DOCTYPE html>
<html>
<head>
    <title>Нотатки</title>
</head>
<body>
    <h1>Мої нотатки</h1>

        <!-- створення нової нотатки -->
        <div>
            <h2>
                <a href="{% url 'notes:note_create' %}">
                    Створити нову нотатку
                </a>
            </h2>
        </div>
        <hr>

    {% for note in notes %}
        <div>
            <h2>
                <a href="{% url 'notes:note_detail' note.id %}">
                    {{ note.title }}
                </a>                
            </h2>            
            <p>{{ note.text }}</p>
            <p><strong>Категорія:</strong> {{ note.category.title }}</p>

            {% if note.reminder %}
                <p><em>Нагадування: {{ note.reminder }}</em></p>
            {% endif %}
        </div>
        <hr>
    {% empty %}
        <p>Нотаток поки немає</p>
    {% endfor %}
</body>
</html>
